server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript;

    # 前端 SPA：所有未匹配路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：前端发起 /api 请求时由 Nginx 转发到后端容器
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }
}
